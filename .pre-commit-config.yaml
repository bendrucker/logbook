repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.67.0
    hooks: [{ id: oxfmt }]
  # oxlint runs from the pinned devDependencies rather than a mirror, since the
  # type-aware rules need oxlint-tsgolint beside it.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: bun run --silent lint
        language: system
        types_or: [ts, json]
        pass_filenames: false
